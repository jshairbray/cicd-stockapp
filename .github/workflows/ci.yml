name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install app packages (exact lock, hashes checked)
        run: pip install --require-hashes -r requirements.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag stockapp:ci .

      - name: Start container
        run: docker run --detach --name stockapp --publish 8501:8501 stockapp:ci

      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' stockapp)
            echo "Attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$(docker inspect --format '{{.State.Running}}' stockapp)" != "true" ]; then
              echo "Container stopped"
              exit 1
            fi
            sleep 2
          done
          echo "Not healthy after 2 minutes"
          exit 1

      - name: Check from outside the container
        run: curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health

      - name: Show logs on failure
        if: failure()
        run: docker logs stockapp

      - name: Log in to Google Cloud (main only)
        id: auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/51964386995/locations/global/workloadIdentityPools/github/providers/cicd-stockapp
          service_account: gh-ci-pusher@jbs-labs.iam.gserviceaccount.com
          token_format: access_token

      - name: Push image to Artifact Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: us-east1-docker.pkg.dev/jbs-labs/stockapp/stockapp:${{ github.sha }}
        run: |
          echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
          docker tag stockapp:ci "$IMAGE"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
